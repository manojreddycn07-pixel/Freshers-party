{% extends "base.html" %}{% block title %}Edit Student{% endblock %}{% block content %}<section class="page-head"><p class="eyebrow">ADMIN DASHBOARD</p><h1>EDIT<br><em>STUDENT.</em></h1></section><form class="neon-form" method="post"><label>FULL NAME<input name="name" value="{{ student.name }}" required></label><label>EMAIL<input name="email" type="email" value="{{ student.email }}" required></label><label>COURSE<input name="course" value="{{ student.course }}" required></label><label>PHONE<input name="phone" value="{{ student.phone or '' }}"></label><button class="button pink">SAVE CHANGES <b>→</b></button></form>{% endblock %}
